version: 2
updates:
  # Keep workflow actions current so runtime deprecations (e.g. Node 20, #227)
  # arrive as PRs rather than as warnings on deploy runs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # One PR per run for all action bumps, instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"
