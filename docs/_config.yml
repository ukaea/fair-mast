# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: MAST Data Catalog
author: Samuel Jackson, Nathan Cummings, Saiful Khan
logo: assets/MAST_plasma_image.jpg

# Information about where the book exists on the web
repository:
  url: https://github.com/ukaea/fair-mast  # Online location of your book
  branch: main
  path_to_book: docs/

exclude_patterns: [data/*, 'data']
only_build_toc_files: true

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  # Notebooks fetch live data from the remote object store on every build
  # (execute_notebooks: force), and the GitHub Pages runner has a high-latency
  # link to the STFC S3 endpoint. Give generous per-cell headroom so data-heavy
  # cells don't time out. This is a ceiling, not a target - fast cells are
  # unaffected.
  timeout: 300
  execute_notebooks: cache
  exclude_patterns:
    - 'data'
    - 'data/*'

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

launch_buttons:
  notebook_interface: classic
  colab_url: "https://colab.research.google.com"
  
# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
